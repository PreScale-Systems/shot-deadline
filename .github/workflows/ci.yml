name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m py_compile agent/pipeline.py app/main.py telemetry/sim.py scripts/provision.py
      - name: Import check (agent pipeline + FastAPI app)
        run: python -c "from agent.pipeline import build_pipeline; from app.main import app; print('imports OK')"
      - name: Simulation dry run (72 production hours)
        run: python telemetry/sim.py
      - name: Validate Grafana dashboard JSON
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("grafana/dashboard.json"))
          assert d.get("panels"), "dashboard has no panels"
          print("dashboard ok:", d.get("title"), "| panels:", len(d["panels"]))
          EOF

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (includes mcp-grafana download)
        run: docker build -t shot-deadline:ci .
